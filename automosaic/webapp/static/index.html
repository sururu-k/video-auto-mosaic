<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>automosaic ライブラリ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 中身は index.js（Preact）が組み立てる。読み込むと body は空にされるので、
     ここに画面の下描きを置いても表示されることはない。置くと、JS が読めない
     ときだけ「押しても何も起きないボタンが並んだ画面」として出てくる。
     JS が動かないなら、動かないと読める状態にしておく。 -->
<noscript>
  <main>
    <div class="card">
      <h2>JavaScript が必要です</h2>
      <p>この画面は JavaScript で組み立てています。無効になっているか、
        <span class="mono">/static/index.js</span> を読めていません。</p>
      <p class="dim">素材の追加だけは JavaScript 無しでもできます。
        （投稿するとジョブの内容が JSON で返ります）</p>
      <form method="post" action="/api/jobs" enctype="multipart/form-data">
        <input type="file" name="file"><button type="submit">送る</button>
      </form>
    </div>
  </main>
</noscript>

<script src="/static/index.js"></script>
</body>
</html>
