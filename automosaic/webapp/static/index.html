<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>automosaic ライブラリ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="top">
  <h1>automosaic</h1>
  <span class="spacer"></span>
  <span id="libpath" class="dim mono"></span>
</header>

<main>
  <div class="card">
    <h2>素材を追加する</h2>
    <div id="drop" class="drop">
      ここに動画をドロップ、または
      <button id="btn-pick">ファイルを選ぶ</button>
      <input id="file" type="file" accept="video/*" class="hidden">
    </div>
    <div id="up" class="hidden" style="margin-top:10px">
      <div class="bar"><i id="upfill"></i></div>
      <p id="upmsg" class="dim"></p>
    </div>
    <!-- JS を切っていても投稿できる経路。multipart で受ける -->
    <noscript>
      <form method="post" action="/api/jobs" enctype="multipart/form-data">
        <input type="file" name="file"><button type="submit">送る</button>
      </form>
    </noscript>
  </div>

  <div class="card">
    <h2>ジョブ</h2>
    <div id="list"><p class="dim">読み込み中</p></div>
  </div>
</main>

<script src="/static/common.js"></script>
<script src="/static/index.js"></script>
</body>
</html>
