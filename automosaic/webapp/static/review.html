<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>automosaic 検査</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="top">
  <a id="back" class="btn" href="/">戻る</a>
  <span id="pos">読み込み中</span>
  <span id="reason" class="tag"></span>
  <span class="spacer"></span>
  <span id="save" class="save ok">保存済</span>
  <button id="btn-menu">設定</button>
</header>

<div class="bar"><i id="progress-fill"></i></div>

<div id="stage">
  <div id="imgwrap">
    <img id="shot" alt="判定対象のフレーム">
    <canvas id="ov"></canvas>
  </div>
</div>
<div id="banner"></div>

<div class="pad">
  <!-- 判定モード。ここだけで1枚が終わるのが普通の流れ -->
  <div id="judge">
    <div class="row">
      <button id="btn-ok" class="big ok half">問題なし</button>
      <button id="btn-ng" class="big ng half">漏れている</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btn-unsure" class="half">判断できない</button>
      <button id="btn-undo" class="half">ひとつ戻す</button>
    </div>
  </div>

  <!-- 位置指定モード -->
  <div id="mark" class="hidden">
    <div class="row">
      <button id="btn-minus">−</button>
      <input id="size" type="range" min="20" max="400" step="5" value="100"
             aria-label="矩形の大きさ" style="flex:1">
      <button id="btn-plus">＋</button>
      <span id="size-label" class="dim mono">-</span>
    </div>
    <div class="row" id="span-row" style="margin-top:8px"></div>
    <button id="btn-confirm" class="big ok" style="margin-top:8px" disabled>画像をタップしてください</button>
    <div class="row" style="margin-top:8px">
      <button id="btn-cancel" class="half">やめる</button>
      <button id="btn-undo2" class="half">ひとつ戻す</button>
    </div>
  </div>
</div>

<!-- 設定シート。普段は畳んでおく -->
<div id="sheet" class="card hidden" style="max-width:720px;margin:0 auto 20px">
  <h2>設定</h2>
  <div class="row">
    <label><input id="opt-raw" type="checkbox"> 原画で確認する</label>
    <label><input id="opt-boxes" type="checkbox" checked> モザイクの範囲を枠で示す</label>
    <label><input id="opt-all" type="checkbox"> 全フレームを対象にする</label>
  </div>
  <div class="row" style="margin-top:8px">
    <label>間隔 <input id="opt-step" type="number" min="1" max="300" value="5" style="width:80px"> フレームおき</label>
    <label>クラス <select id="opt-class"></select></label>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="btn-rebuild">キューを作り直す</button>
    <button id="btn-unjudged">未判定の先頭へ</button>
    <button id="btn-prev-item">前の1枚</button>
    <button id="btn-next-item">次の1枚</button>
    <button id="btn-close-sheet">閉じる</button>
  </div>
  <p id="sheet-info" class="dim"></p>
  <p class="dim">キー: 1 問題なし / 2 漏れている / 3 判断できない / U ひとつ戻す / ← → 前後の1枚</p>
</div>

<script src="/static/common.js"></script>
<script src="/static/review.js"></script>
</body>
</html>
