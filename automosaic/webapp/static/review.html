<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>automosaic 検査</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/review.css">
</head>
<body>

<!-- 中身は review.js（Preact）が組み立てる。index.html と同じ理由で下描きは置かない。
     判定の画面で「押しても何も起きないボタン」が出るのがいちばん悪い。
     押したつもりの判定が記録されないまま、検査が進んだと思い込む -->
<noscript>
  <main>
    <div class="card">
      <h2>JavaScript が必要です</h2>
      <p>この画面は JavaScript で組み立てています。無効になっているか、
        <span class="mono">/static/review.js</span> を読めていません。</p>
      <p class="dim">このままでは判定を1件も記録できません。JavaScript を有効にしてから開き直してください。</p>
    </div>
  </main>
</noscript>

<script src="/static/review.js"></script>
</body>
</html>
