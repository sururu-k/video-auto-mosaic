<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>automosaic 検査</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 中身は app.js（Preact 相当のバンドル）が組み立てる。document.body を
     一度空にしてから描くので、ここに下描きの静的マークアップを置いても
     JS が動いた瞬間に消える。判定の画面で「押しても何も起きないボタン」が
     並ぶのがいちばん悪い。押したつもりの判定が記録されないまま、
     検査が進んだと思い込む。app.js に getElementById / querySelector が
     無いこと（既存 DOM を読みに来ない実装であること）を確認したうえで
     このマークアップは削除した -->
<noscript>
  <main style="max-width:32em;margin:10vh auto;padding:0 16px;">
    <h2>JavaScript が必要です</h2>
    <p>この画面は JavaScript で組み立てています。無効になっているか、
      <span style="font-family:monospace;">/static/app.js</span> を読めていません。</p>
    <p style="color:#8b95a2;">このままでは判定を1件も記録できません。JavaScript を有効にしてから開き直してください。</p>
  </main>
</noscript>

<script src="/static/app.js"></script>
</body>
</html>
