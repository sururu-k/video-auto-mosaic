<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>automosaic 検査</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header id="bar">
  <div id="progress"><div id="progress-fill"></div></div>
  <div id="bar-row">
    <span id="pos">読み込み中</span>
    <span id="reason" class="tag"></span>
    <span id="save" class="save ok">保存済</span>
    <button id="btn-menu" class="icon" aria-label="設定">設定</button>
  </div>
</header>

<main id="stage">
  <div id="imgwrap">
    <img id="shot" alt="判定対象のフレーム">
    <canvas id="ov"></canvas>
  </div>
  <div id="banner" class="hidden"></div>
</main>

<footer id="pad">
  <!-- 判定モード。ここだけで1枚が終わるのが普通の流れ -->
  <div id="judge">
    <button id="btn-ok" class="big ok">問題なし</button>
    <!-- 範囲を直す2つ。縦に4つ積むと縦持ちで画像面が潰れるので横に並べる。
         高さは他と同じ 64px のままにして、指の狙いやすさを落とさない -->
    <div class="row">
      <button id="btn-ng" class="big ng">漏れている</button>
      <button id="btn-big" class="big warn">でかすぎる</button>
    </div>
    <div class="row">
      <button id="btn-unsure" class="mid">判断できない</button>
      <button id="btn-undo" class="mid">ひとつ戻す</button>
    </div>
  </div>

  <!-- 位置指定モード。「漏れている」と「でかすぎる」で共用する。
       操作系を分けると、片方だけ手に馴染まないものになる -->
  <div id="mark" class="hidden">
    <div id="mark-title" class="mark-title"></div>
    <div class="row size-row">
      <button id="btn-minus" class="sq">−</button>
      <input id="size" type="range" min="20" max="400" step="5" value="100"
             aria-label="矩形の大きさ">
      <button id="btn-plus" class="sq">＋</button>
      <span id="size-label" class="size-label">-</span>
    </div>
    <div class="row" id="span-row"></div>
    <button id="btn-confirm" class="big ok" disabled>画像をタップしてください</button>
    <div class="row">
      <button id="btn-cancel" class="mid">やめる</button>
      <button id="btn-undo2" class="mid">ひとつ戻す</button>
    </div>
  </div>
</footer>

<!-- 設定シート。普段は畳んでおく。ここに置くのは頻度の低い操作だけ -->
<div id="sheet" class="hidden">
  <div id="sheet-inner">
    <h2>設定</h2>

    <label class="opt"><input id="opt-raw" type="checkbox"> 原画で確認する（モザイクを外す）</label>
    <label class="opt"><input id="opt-boxes" type="checkbox" checked> モザイクの範囲を枠で示す</label>
    <label class="opt"><input id="opt-all" type="checkbox"> 全フレームを対象にする</label>

    <label class="opt-row">間隔
      <input id="opt-step" type="number" min="1" max="300" value="5"> フレームおき
    </label>

    <label class="opt-row">クラス
      <select id="opt-class"></select>
    </label>

    <div class="opt-row">
      <button id="btn-rebuild" class="mid wide">キューを作り直す</button>
    </div>
    <div class="opt-row">
      <button id="btn-unjudged" class="mid wide">未判定の先頭へ</button>
    </div>
    <div class="opt-row">
      <button id="btn-prev-item" class="mid">前の1枚</button>
      <button id="btn-next-item" class="mid">次の1枚</button>
    </div>

    <p id="sheet-info" class="info"></p>
    <p class="info">
      <a id="link-timeline" href="/timeline">タイムライン画面（PC 向け）</a>
    </p>
    <p class="info">
      キー: 1 問題なし / 2 漏れている / 3 判断できない / 4 でかすぎる /
      U ひとつ戻す / ← → 前後の1枚 / Esc やめる
    </p>

    <button id="btn-close-sheet" class="big">閉じる</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
