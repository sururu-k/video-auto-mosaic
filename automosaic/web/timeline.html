<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>automosaic タイムライン</title>
<link rel="stylesheet" href="/static/timeline.css">
</head>
<body>

<!-- 中身は timeline.js（Preact 相当のバンドル）が組み立てる。index.html と
     同じ理由で下描きは置かない。timeline.js に getElementById が無いこと
     （querySelector も id セレクタでは使っていないこと）を確認したうえで、
     このマークアップは削除した。W-6 の舞台であるこの画面で
     「押しても何も起きないボタン」が並ぶのがいちばん悪い -->
<noscript>
  <main style="max-width:32em;margin:10vh auto;padding:0 16px;">
    <h2>JavaScript が必要です</h2>
    <p>この画面は JavaScript で組み立てています。無効になっているか、
      <span style="font-family:monospace;">/static/timeline.js</span> を読めていません。</p>
    <p style="color:#8b95a2;">このままでは修正を1件も記録できません。JavaScript を有効にしてから開き直してください。</p>
  </main>
</noscript>

<script src="/static/timeline.js"></script>
</body>
</html>
