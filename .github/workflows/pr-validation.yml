name: PR validation

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Python syntax
        run: python -m compileall -q automosaic tests tools
      - name: Build and validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run typecheck
      - name: Run frontend logic tests
        run: node tests/test_frontend.mjs
